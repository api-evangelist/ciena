apis:
- aid: ciena:mcp-api
  name: Ciena MCP (Manage, Control and Plan) API
  description: >-
    Ciena's Manage, Control and Plan (MCP) is a multi-layer Software Defined Networking (SDN) and Network
    Management System (NMS) platform. The MCP REST and RESTCONF APIs enable network-aware management operations
    for optical and packet networks including topology discovery, circuit provisioning, configuration
    management, and performance data retrieval.
  humanURL: >-
    https://software.ciena.com/releasenotes/MCP-DOCS_5.2-217/build/site/mcp-docs/user-guide/Overview.html
  baseURL: https://api.ciena.com/mcp
  tags:
