  - type: Documentation
    url: >-
      https://software.ciena.com/releasenotes/MCP-DOCS_5.2-217/build/site/mcp-docs/user-guide/Overview.html
- aid: ciena:emulation-cloud-api
  name: Ciena Emulation Cloud API
  description: >-
    Ciena Emulation Cloud is an open application development environment enabling developers to create,
    test, and fine-tune custom applications against full API definitions without requiring physical infrastructure.
    Provides access to complete API documentation, tutorials, and sample code for Ciena network platforms.
  humanURL: https://www.ciena.com/products/emulation-cloud
